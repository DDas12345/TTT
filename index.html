<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Tic-Tac-Toe</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="wrapper">
        <div class="container">
            <h1>Poke-Tac-Toe</h1>
            <div class="turn-indicator">
                <img src="pikachu.png" alt="Pikachu" id="pika-indicator" class="active">
                <span>VS</span>
                <img src="eevee.png" alt="Eevee" id="eevee-indicator">
            </div>
            <div class="game-wrapper">
                <div class="row">
                    <div class="box" data-index="0">
                        
                    </div>

                    <div class="box" data-index="1">

                    </div>

                    <div class="box" data-index="2">

                    </div>
                </div>

                <div class="row">
                    <div class="box" data-index="3">

                    </div>

                    <div class="box" data-index="4">

                    </div>

                    <div class="box" data-index="5">

                    </div>
                </div>

                <div class="row">
                    <div class="box" data-index="6">
                        
                    </div>
                    
                    <div class="box" data-index="7">

                    </div>

                    <div class="box" data-index="8">

                    </div>
                </div>

            </div>

            <div class="controllers">
                <div class="winner" id="status-text">Pikachu's Turn!</div>
                <button class="reset" id="reset-btn">Reset Battle</button>
            </div>

        </div>
    </div>

    <script src="./main.js"></script>
</body>
</html>
