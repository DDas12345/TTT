<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Tic-Tac-Toe: Divine Edition</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <div id="wrapper">
        <div class="arceus-host">
            <img src="arceus.png" alt="Arceus Host" id="arceus-img">
            <div class="host-bubble">Welcome to the Divine Battle. Choose your side.</div>
        </div>

        <div class="container">
            <div class="logo-container">
                <img src="logo.png" alt="Poke-Tac-Toe Logo" id="game-logo">
            </div>

            <div class="turn-indicator">
                <div class="player-label">
                    <img src="pikachu.png" alt="Pikachu" id="pika-indicator" class="active">
                    <span>Pikachu</span>
                </div>
                <span class="vs-text">VS</span>
                <div class="player-label">
                    <img src="eevee.png" alt="Eevee" id="eevee-indicator">
                    <span>Eevee</span>
                </div>
            </div>

            <div class="game-wrapper" id="grid-container">
                <!-- Grid will be generated by JS -->
            </div>

            <div class="controllers">
                <div class="winner" id="status-text">Pikachu's Turn!</div>
                <button class="reset" id="reset-btn">Reset Battle</button>
            </div>
        </div>
    </div>

    <script src="./main.js"></script>
</body>

</html>
